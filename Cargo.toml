[workspace]
members = [
    "crates/preferz",
    "crates/preferz-core",
    "crates/preferz-fileio",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Picture Reference Zoomer — a minimal reference image board"
repository = "https://github.com/Feihei/PReferZ"

[workspace.metadata.release]
# 所有 crate 共用 workspace 版本，发布时同步 bump
shared-version = true
# 只允许从 main 分支发布
allow-branch = ["main"]
# workspace 版本同步，一次 bump 提交搞定
consolidate-commits = true
# 版本 bump 的提交信息
pre-release-commit-message = "chore: Release v{{version}}"
# tag 名称：v0.1.0（与 release.yml 的 v* 触发规则一致）
tag-name = "v{{version}}"
# 轻量 tag（不写注释）
tag-message = ""
# 二进制应用，不发布到 crates.io（发布由 GitHub Actions 构建产物）
publish = false
# 发布时自动提交版本改动并推送到远程
push-remote = "origin"
push = true
sign-commit = false
sign-tag = false
pre-release-replacements = []

[workspace.dependencies]
# Core
euclid = { version = "0.22", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# GUI
# eframe 0.36 默认含 wgpu 渲染后端，但 wgpu 30 在本机 windows 0.62/MSVC 下编译失败
# （wgpu-hal dx12 绑定 trait bound 不满足）。项目零 wgpu 引用、约定用 glow 后端，故显式关默认
# features：保留原默认项（accesskit/default_fonts/links/wayland/web_screen_reader/x11），
# 把渲染后端从 wgpu 换成 glow，既绕开损坏的传递依赖又对齐既定后端。
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "web_screen_reader",
    "x11",
] }
egui = "0.36"

# File I/O
rusqlite = { version = "0.31", features = ["bundled"] }
image = "0.25"

# Utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
rfd = "0.14"
arboard = "3"
# 字体压缩（build.rs deflate + 运行时解压）。用 rust_backend 走 miniz_oxide，
# 显式关掉默认特性以免引入 zlib C 依赖；依赖树里 image/rusqlite 已在用同一后端。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
