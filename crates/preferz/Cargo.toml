[package]
name = "preferz"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "preferz"
path = "src/main.rs"

[dependencies]
preferz-core = { path = "../preferz-core" }
preferz-fileio = { path = "../preferz-fileio" }

# GUI
eframe = { workspace = true }
egui = { workspace = true }

# Geometry
euclid = { workspace = true }

# Utilities
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
rfd = { workspace = true }
arboard = { workspace = true }

# Image
image = { workspace = true }

# 字体压缩（运行时 inflate，配合 build.rs 的 deflate）
flate2 = { workspace = true }

[build-dependencies]
flate2 = { workspace = true }

# Windows exe 资源图标（编译期嵌入 .res 到 exe）
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
